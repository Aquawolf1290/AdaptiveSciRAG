[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG for scientific papers: text + figure retrieval with a pluggable LLM layer (local Ollama by default, AWS Bedrock Claude optional)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "open-clip-torch>=2.24.0",
    "torch>=2.2.0",
    "chromadb>=0.5.0",
    "pillow>=10.3.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
